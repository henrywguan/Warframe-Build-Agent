# Lightweight defaults for the Warframe Build Agent profile.
# Installers can change model/provider locally; updates preserve config.yaml unless --force-config.

# Leave provider/model unset so Hermes uses the user's existing setup.
# For a local LLM (Qwen via Ollama / LM Studio / vLLM), configure an OpenAI-compatible
# provider pointing at your local server — see LOCAL_LLM.md. Example:
#
# model:
#   provider: openai
#   name: qwen3.6
#   # base_url: http://127.0.0.1:11434/v1
#
# And in the profile .env:
#   OPENAI_API_KEY=ollama
#   OPENAI_BASE_URL=http://127.0.0.1:11434/v1

terminal:
  # Default cwd: Warframe-Build-Agent checkout for knowledge/wf/market/patches CLIs.
  # For general coding in another repo, change the profile working directory in Hermes.
  # Agent Reach installs to ~/.agent-reach/ (not into this cwd).
  cwd: "."

# Coding-agent profile notes:
# - Skills under skills/software-development/ implement a Cursor-like loop.
# - Enable Hermes native tools (filesystem, terminal, web) in the Desktop/CLI settings.
# - Optional: keep Hermes bundled software-development skills seeded
#   (`hermes skills opt-in --sync`) in addition to this profile's skills.
