name: warframe-build-agent
version: 0.6.0
description: "Ordis — Cursor-class general AI agent + Warframe specialty + always-online research (Agent Reach); local-LLM friendly"
hermes_requires: ">=0.12.0"
author: "Henry Guan"
license: "MIT"
env_requires:
  - name: OPENAI_API_KEY
    description: "API key for Hermes model provider (use any string like 'ollama' for local OpenAI-compatible servers)"
    required: false
  - name: OPENAI_BASE_URL
    description: "Optional OpenAI-compatible base URL for a local LLM (e.g. http://127.0.0.1:11434/v1 for Ollama/Qwen)"
    required: false
  - name: OPENAI_MODEL
    description: "Optional model id (e.g. qwen3.6) when using OPENAI_BASE_URL"
    required: false
distribution_owned:
  - SOUL.md
  - LOCAL_LLM.md
  - AGENT_REACH.md
  - CODING.md
  - config.yaml
  - skills/
  - distribution.yaml
  - profile.yaml
